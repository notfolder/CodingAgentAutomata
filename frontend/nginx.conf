server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # compose のネットワークの名前解決を使い、backend の名前を要求のたびに引き直す
    # （backend だけが作り直されて IP アドレスが変わっても、古い宛先へつなぎ続けないため）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # /api/ プレフィックスのリクエストをバックエンドへプロキシ
    # （転送先に変数を使うときは URI を書かない。要求の URI がそのまま backend の /api/... へ渡る）
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA のフォールバック: 全ルートを index.html へ
    location / {
        try_files $uri $uri/ /index.html;
    }
}
